name: Security
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '20 8 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scan:
    name: scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build -t guardrails:scan .
      # Tool version is fixed; vulnerability databases update at run time.
      - name: Scan source for secrets and configuration issues
        run: >-
          docker run --rm -v "$PWD:/src:ro" aquasec/trivy:0.69.3
          fs --scanners vuln,secret,misconfig --exit-code 1 --severity HIGH,CRITICAL /src
      - name: Scan OS and Python runtime dependencies
        run: |
          docker save guardrails:scan -o /tmp/guardrails-image.tar
          docker run --rm -v /tmp/guardrails-image.tar:/scan/image.tar:ro aquasec/trivy:0.69.3 image --input /scan/image.tar --exit-code 1 --severity HIGH,CRITICAL
      - name: Scan optional data toolkit lock
        run: |
          mkdir -p /tmp/guardrails-data-scan
          cp requirements-data.txt /tmp/guardrails-data-scan/requirements.txt
          docker run --rm -v /tmp/guardrails-data-scan:/src:ro aquasec/trivy:0.69.3 fs --scanners vuln --exit-code 1 --severity HIGH,CRITICAL /src
