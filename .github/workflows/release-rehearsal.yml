name: Release rehearsal
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rehearse:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: training-release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -v
      - run: docker build -t guardrails:rehearsal .
      - run: bash scripts/container-check.sh guardrails:rehearsal
      - name: Record rehearsal evidence
        run: |
          echo "## Local container rehearsal" >> "$GITHUB_STEP_SUMMARY"
          echo "Source: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          docker image inspect guardrails:rehearsal --format='Image: {{.Id}}' >> "$GITHUB_STEP_SUMMARY"
          echo "Functional check passed. Runner container removed; no hosted deployment performed." >> "$GITHUB_STEP_SUMMARY"
